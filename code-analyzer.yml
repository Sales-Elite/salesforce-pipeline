# Salesforce Code Analyzer configuration
# Generated by OrgBlazer: the rule profile every change is scanned with before it is handed over.
# Run it yourself:  sf plugins install code-analyzer@5.16.0
#                   sf code-analyzer run -r Recommended -r Security -r AppExchange -s 2
# Docs: https://developer.salesforce.com/docs/platform/salesforce-code-analyzer/guide/config-custom.html
ignores:
  files:
    - "**/node_modules/**"
    - "**/.sfdx/**"
    - "**/.sf/**"
rules:
  pmd:
    ApexCRUDViolation:
      severity: 1
    ApexSOQLInjection:
      severity: 1
    ApexXSSFromEscapeFalse:
      severity: 1
    ApexXSSFromURLParam:
      severity: 1
    ApexOpenRedirect:
      severity: 1
    ApexBadCrypto:
      severity: 1
    ApexInsecureEndpoint:
      severity: 1
    VfUnescapeEl:
      severity: 1
    ApexSharingViolations:
      severity: 2
    AvoidHardcodingId:
      severity: 2
    OperationWithLimitsInLoop:
      severity: 2
    AvoidHardcodedCredentialsInFieldDecls:
      severity: 1
    AvoidGlobalModifier:
      severity: 3
  flow:
    PreventPassingUserDataIntoElementWithoutSharing:
      severity: 1
engines:
  sfge:
    disable_engine: true
  regex:
    custom_rules:
      NoCardNumberInSource:
        regex: "/\\b(?:4\\d{3}|5[1-5]\\d{2}|3[47]\\d{2}|6011)[ -]?\\d{4}[ -]?\\d{4}[ -]?\\d{3,4}\\b/g"
        file_extensions: [".cls", ".trigger", ".js", ".html", ".page", ".component"]
        description: "Card numbers (PCI DSS) must never appear in source code."
        violation_message: "This looks like a payment card number. Remove it; card data must never be in source code (PCI DSS)."
        severity: 1
        tags: ["Recommended", "Security"]
      NoNationalIdInSource:
        regex: "/\\b\\d{3}-\\d{2}-\\d{4}\\b/g"
        file_extensions: [".cls", ".trigger", ".js", ".html", ".page", ".component"]
        description: "US Social Security numbers must never appear in source code."
        violation_message: "This looks like a Social Security number. Remove it; personal data must never be in source code."
        severity: 1
        tags: ["Recommended", "Security"]
      NoHardcodedSecret:
        regex: "/(?:password|passwd|secret|api[_-]?key|access[_-]?token|client[_-]?secret)\\s*[:=]\\s*['\"][^'\"\\s]{6,}['\"]/gi"
        file_extensions: [".cls", ".trigger", ".js", ".html", ".page", ".component"]
        description: "Credentials belong in Named Credentials, never in code."
        violation_message: "A password, key or token is written into the code. Use a Named Credential or protected Custom Metadata instead."
        severity: 1
        tags: ["Recommended", "Security"]
      WithoutSharingNeedsReason:
        regex: "/^(?!.*\\/\\/\\s*sharing-reason:).*\\bwithout\\s+sharing\\b.*$/gim"
        file_extensions: [".cls"]
        description: "A class that ignores sharing rules must say why."
        violation_message: "This class runs \"without sharing\", so it ignores record-level security. Use \"with sharing\" or \"inherited sharing\", or add \"// sharing-reason: <why>\" on the same line for the reviewer."
        severity: 2
        tags: ["Recommended", "Security"]
